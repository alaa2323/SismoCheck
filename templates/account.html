{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Mon compte</h1><p>{{ session.username }} · {{ role_label }}</p></div></div>
<form method="post" class="panel" style="max-width:520px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="panel-title mb-3">Changer le mot de passe</div>
  <div class="mb-3"><label class="form-label">Mot de passe actuel</label><input type="password" name="current_password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Nouveau mot de passe (6 caractères minimum)</label><input type="password" name="new_password" class="form-control" required minlength="6"></div>
  <div class="mb-4"><label class="form-label">Confirmer le nouveau mot de passe</label><input type="password" name="confirm_password" class="form-control" required minlength="6"></div>
  <button class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
