# Pipeline Azure DevOps : lance les tests unitaires à chaque modification de la branche main
trigger:
  branches:
    include:
      - main

pool:
  name: agent2

steps:
  - script: python -m pip install -r requirements.txt
    displayName: Installer les dépendances

  - script: python -m unittest discover -s tests -v
    displayName: Lancer les tests unitaires
